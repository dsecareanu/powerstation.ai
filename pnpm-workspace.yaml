packages:
  - schema
  - pipeline
  - packages/*
  - apps/*

# Supply-chain guard: install only package versions published at least 7 days ago.
minimumReleaseAge: 10080

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
  # wrangler's runtime. Its install script only optimizes the binary lookup; not needed.
  workerd: false
