name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Generated types match the schema
        run: pnpm schema:check
      - name: Validator tests
        run: pnpm test
      - name: Fixtures validate against the schema
        run: pnpm validate:fixtures
      - name: Fixtures are reproducible from the generator
        run: |
          pnpm fixtures
          git diff --exit-code -- fixtures
