name: Monthly data-center update

# Downloads Epoch AI's "AI supercomputers" dataset (CC BY 4.0), keeps the sites
# in the v1 zones, checks the files and uploads them to R2.
# It reads zones.json and status.json from R2, so the hourly job must have run once.

on:
  schedule:
    - cron: "41 4 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  datacenters:
    runs-on: ubuntu-latest
    environment: data-publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the data-center file
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: pnpm --filter @powerstation/pipeline run datacenters --out pipeline/out/monthly
      - name: Validate the files for deploy
        run: pnpm validate --deploy pipeline/out/monthly/v1
      - name: Upload the files to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: pnpm --filter @powerstation/pipeline run upload pipeline/out/monthly
