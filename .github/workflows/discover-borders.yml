name: Discover borders

# Finds which zone pairs publish physical flows on ENTSO-E (open data) and proposes
# pipeline/reference/borders.json as a pull request. Run it by hand only.
# The token lives only in the GitHub environment "data-publish" and is never printed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-borders
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: data-publish
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Query physical flows for every zone pair (about 2,350 requests)
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if [ -z "$ENTSOE_TOKEN" ]; then
            echo 'Missing secret ENTSOE_TOKEN (add it to the GitHub environment "data-publish")'
            exit 1
          fi
          pnpm --filter @powerstation/pipeline run discover-borders
      - name: Format the result
        run: pnpm exec prettier --write pipeline/reference/borders.json
      - name: Commit to a new branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: data/borders-${{ github.run_id }}
        run: |
          if git diff --quiet -- pipeline/reference/borders.json && git ls-files --error-unmatch pipeline/reference/borders.json >/dev/null 2>&1; then
            echo "borders.json did not change. Nothing to propose." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # Only the result file. The cache (pipeline/out/) is git-ignored and stays out.
          git add pipeline/reference/borders.json
          git commit -m "Update borders.json from ENTSO-E physical flows (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          body="Generated by the Discover borders workflow, run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Review the zone pairs before merging. CI on this pull request needs a person to select Approve workflows to run."
          if gh pr create --base main --head "$BRANCH" --title "Update borders.json (discover-borders run ${{ github.run_id }})" --body "$body"; then
            echo "Pull request opened for branch $BRANCH." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open the pull request. Check Settings > Actions > General > Allow GitHub Actions to create and approve pull requests. The branch is pushed."
            echo "Could not open the pull request automatically. Open it here: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
