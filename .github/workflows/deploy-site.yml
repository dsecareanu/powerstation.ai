name: Deploy site (preview)

# Builds the static site (apps/site) and deploys it to the Cloudflare Worker
# "powerstation-site", on its workers.dev URL only. No routes, no custom domains.
# The same Cloudflare account hosts the Worker "domain-landers" (13 domains): this
# workflow must never deploy to it. The guard step checks the Worker name every run.
#
# Data mode: repo variable SITE_DATA_MODE. "demo" (default, also when unset) = mock
# fixtures with a banner. "live" = real data from https://data.powerstation.ai.
#
# Pull requests run the build job only (both modes + wrangler dry run, no secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "schema/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Worker guard (only "powerstation-site", no routes)
        run: pnpm --filter @powerstation/site run check:worker
      - name: Production build (fails if fixtures or demo markers are in it)
        run: pnpm build:site
      - name: Demo build (fails if a page has no demo banner)
        run: pnpm build:site:demo
      - name: Wrangler dry run (no upload, no credentials)
        working-directory: apps/site
        run: pnpm exec wrangler deploy --dry-run

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site-deploy
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::missing secret $name (add it to the GitHub environment \"site-deploy\")"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Worker guard (only "powerstation-site", no routes)
        run: pnpm --filter @powerstation/site run check:worker
      - name: Build in the data mode set by SITE_DATA_MODE
        env:
          SITE_DATA_MODE: ${{ vars.SITE_DATA_MODE || 'demo' }}
        run: |
          case "$SITE_DATA_MODE" in
            demo) pnpm build:site:demo ;;
            live) pnpm build:site ;;
            *) echo "::error::SITE_DATA_MODE must be \"demo\" or \"live\", not \"$SITE_DATA_MODE\""; exit 1 ;;
          esac
      - name: Deploy to the Worker "powerstation-site"
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
